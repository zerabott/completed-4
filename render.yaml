services:
  # Telegram Bot as Web Service (for free 24/7 hosting)
  - type: web
    name: telegram-confession-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot_web.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_ID_1
        sync: false
      - key: ADMIN_ID_2
        sync: false
      - key: USE_POSTGRESQL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
        # Optional: Override individual PostgreSQL connection parameters  
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
    autoDeploy: true
